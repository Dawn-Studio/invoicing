name: Release

# Pushing a tag like v0.2.0 builds the app for macOS (Apple silicon + Intel), Windows and
# Linux and uploads everything to a draft GitHub Release. Publishing the draft is what makes
# installed apps see the update. See docs/releasing.md.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Tag matches the app version
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match apps/desktop/package.json version $version"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # One draft for all three platforms; creating it here avoids the jobs below racing to
      # create one each.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --title "Invoicing ${GITHUB_REF_NAME#v}" --generate-notes
          fi

  package:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # One Mac builds both architectures: the SQLite binaries are prebuilt for each.
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@dawnstudio/desktop
      - name: Package and upload
        working-directory: apps/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The publish settings also go into app-update.yml, which tells the installed app
        # where to look for updates.
        run: >
          pnpm exec electron-builder ${{ matrix.target }} --publish always
          -c.publish.provider=github
          -c.publish.owner=${{ github.repository_owner }}
          -c.publish.repo=${{ github.event.repository.name }}
          -c.publish.releaseType=draft
          -c.extraMetadata.homepage=https://github.com/${{ github.repository }}
