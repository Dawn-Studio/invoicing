<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Invoicing</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23281e"/>
      <stop offset="1" stop-color="#0b0d09"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6ff6e"/>
      <stop offset="1" stop-color="#7ff03a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.92" r="0.6">
      <stop offset="0" stop-color="#8fff4a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8fff4a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  </g>
  <!-- The invoice: a sheet with a torn (zigzag) bottom edge, centred on the body (the
       zigzag's dips count half, so the sheet looks centred rather than measures centred). -->
  <g transform="translate(0 18)">
    <path d="M352 258 h320 a40 40 0 0 1 40 40 V742
             l-50 -34 l-50 34 l-50 -34 l-50 34 l-50 -34 l-50 34 l-50 -34 l-50 34
             V298 a40 40 0 0 1 40 -40 z"
          fill="url(#sheet)"/>
    <!-- Lines and the total -->
    <rect x="352" y="338" width="150" height="34" rx="17" fill="#0e100c" fill-opacity="0.85"/>
    <rect x="352" y="420" width="280" height="22" rx="11" fill="#0e100c" fill-opacity="0.28"/>
    <rect x="352" y="472" width="230" height="22" rx="11" fill="#0e100c" fill-opacity="0.28"/>
    <rect x="352" y="524" width="260" height="22" rx="11" fill="#0e100c" fill-opacity="0.28"/>
    <rect x="492" y="600" width="140" height="34" rx="17" fill="#0e100c" fill-opacity="0.85"/>
  </g>
</svg>
